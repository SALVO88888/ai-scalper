<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI Scalper" />
    <title>AI Scalper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --font-sans: 'Inter', sans-serif;
        --color-text-primary: #111;
        --color-text-secondary: #666;
        --color-background-primary: #fff;
        --color-background-secondary: #f5f5f5;
        --color-border-secondary: #e0e0e0;
        --color-border-tertiary: #ebebeb;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
      }
      body { font-family: var(--font-sans); background: #f8f8f8; min-height: 100vh; }
      #root { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #f8f8f8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
